# fly.toml app configuration file generated for watchtower-backend on 2025-12-25T19:25:36+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'watchtower-backend'
primary_region = 'cdg'

[build]
  image = 'ghcr.io/get-convex/convex-backend:latest'

[env]
  TMPDIR = '/convex/data/tmp'
  CONVEX_CLOUD_ORIGIN = 'https://watchtower-backend.fly.dev'
    CONVEX_SITE_ORIGIN = 'https://watchtower-backend.fly.dev/http'

[[mounts]]
  source = 'convex_data'
  destination = '/convex/data'

[http_service]
  internal_port = 3210
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '5s'
    timeout = '30s'
    grace_period = '5s'
    method = 'GET'
    path = '/version'
    protocol = 'http'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
